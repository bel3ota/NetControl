name: Build Windows installers and Android APK

on: [push, workflow_dispatch]

permissions:
  contents: write

concurrency:
  group: netcontrol-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows desktop (EXE)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build frontend bundle
        working-directory: apps/desktop
        run: npm run build

      - name: Build portable Windows executable
        shell: pwsh
        run: |
          cargo build --release -p netcontrol-desktop --verbose 2>&1 | Tee-Object -FilePath tauri-build.log
          if ($LASTEXITCODE -ne 0) {
            "### Windows executable build failed" | Out-File -Append $env:GITHUB_STEP_SUMMARY
            Get-Content tauri-build.log -Tail 160 | Out-File -Append $env:GITHUB_STEP_SUMMARY
            Get-Content tauri-build.log |
              Where-Object { $_ -match 'error(\[|:)|failed|cannot|not found|undefined' } |
              Select-Object -Last 8 |
              ForEach-Object {
                $safe = $_ -replace '%','%25' -replace "`r",'' -replace "`n",'%0A'
                Write-Output "::error title=Windows build::$safe"
              }
            exit $LASTEXITCODE
          }

      - name: Stage executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/windows | Out-Null
          $candidates = @(
            "target/release/netcontrol-desktop.exe",
            "apps/desktop/src-tauri/target/release/netcontrol-desktop.exe"
          )
          $exe = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) {
            "### NetControl.exe was not produced" | Out-File -Append $env:GITHUB_STEP_SUMMARY
            Get-ChildItem -Recurse -Filter "*.exe" | Select-Object FullName | Out-File -Append $env:GITHUB_STEP_SUMMARY
            exit 1
          }
          Copy-Item $exe artifacts/windows/NetControl.exe

      - name: Upload Windows executable and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netcontrol-windows
          path: |
            artifacts/windows/NetControl.exe
            tauri-build.log
          if-no-files-found: warn

  android:
    name: Android APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Configure Android SDK from runner image
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found at $SDKMANAGER" >&2
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: apps/android
        shell: bash
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "### Android build failed" >> "$GITHUB_STEP_SUMMARY"
            tail -120 gradle-build.log >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi

      - name: Stage APK
        run: |
          mkdir -p artifacts/android
          cp apps/android/app/build/outputs/apk/debug/app-debug.apk \
            artifacts/android/netcontrol-android-debug.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: netcontrol-android-apk
          path: artifacts/android/netcontrol-android-debug.apk
          if-no-files-found: error

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-24.04
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/netcontrol-windows/**/*.exe
            artifacts/netcontrol-android-apk/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
